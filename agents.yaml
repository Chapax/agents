# Manifeste multi-agents — un seul endroit pour tous tes agents.
#
# Chaque entrée décrit UNE chose (un skill, un serveur MCP, un plugin, un réglage)
# et dit, pour chaque agent, OÙ elle doit vivre sur cette machine.
#
# kind    : skill | mcp | plugin | config
# agents  : les agents concernés. Chacun a son propre emplacement.
# targets : agent → chemin. « ~ » est accepté. Un agent absent de la carte
#           n'est simplement pas configuré pour cette entrée.
# enabled : ton intention. `agents --check` compare l'intention à la machine.

version: 2

# Emplacements connus, vérifiés sur cette machine le 22/11/2026.
# Sert de référence ; les entrées ci-dessous les utilisent directement.
agents_connus:
  hermes:
    config: ~/.hermes/config.yaml
    skills: ~/.hermes/skills
    profils: ~/.hermes/profiles
  claude:
    config: ~/.claude/settings.json
    mcp: ~/.claude.json
    skills: ~/.claude/skills
  codex:
    config: ~/.codex/config.toml
    hooks: ~/.codex/hooks.json
  gemini:
    config: ~/.gemini/settings.json
    mcp: ~/.gemini/config/mcp_config.json
  opencode:
    config: ~/.config/opencode/opencode.json
  cursor:
    hooks: ~/.cursor/hooks.json
  pi:
    config: ~/.pi/config.json     # à confirmer

entries:
  # ============================================================ skills
  - id: superpowers
    kind: skill
    name: Superpowers
    source: obra/superpowers
    enabled: false
    agents: [hermes, claude, codex]
    targets:
      hermes: ~/.hermes/skills/superpowers
      claude: ~/.claude/skills/superpowers
      codex: ~/.codex/skills/superpowers
    note: TDD, revue de code, débogage en 4 phases ; 324k étoiles, sans licence

  - id: mattpocock
    kind: skill
    name: Matt Pocock skills
    source: mattpocock/skills
    enabled: false
    agents: [hermes, claude]
    targets:
      hermes: ~/.hermes/skills/mattpocock
      claude: ~/.claude/skills/mattpocock
    note: grill-me, to-spec, to-tickets, tdd ; 330k étoiles, sans licence

  - id: gamedev
    kind: skill
    name: Game dev router
    source: gamedev-skills/awesome-gamedev-agent-skills
    enabled: false
    agents: [hermes, claude, codex]
    targets:
      hermes: ~/.hermes/skills/gamedev
      claude: ~/.claude/skills/gamedev
      codex: ~/.codex/skills/gamedev
    note: routeur qui ne charge que la branche du moteur détecté

  - id: repo-scout
    kind: skill
    name: github-repo-scout
    source: local
    enabled: true
    agents: [hermes]
    targets:
      hermes: ~/.hermes/skills/research/github-repo-scout
    note: choisir et juger un dépôt GitHub avec des chiffres mesurés

  # ============================================================ MCP
  - id: openviking
    kind: mcp
    name: OpenViking
    source: http://127.0.0.1:1933/mcp
    enabled: true
    agents: [hermes, claude, codex, gemini]
    targets:
      hermes: ~/.hermes/config.yaml
      claude: ~/.claude.json
      codex: ~/.codex/config.toml
      gemini: ~/.gemini/config/mcp_config.json
    note: accès sémantique au coffre

  - id: context7
    kind: mcp
    name: Context7
    source: https://mcp.context7.com/mcp
    enabled: false
    agents: [hermes, claude, gemini]
    targets:
      hermes: ~/.hermes/config.yaml
      claude: ~/.claude.json
      gemini: ~/.gemini/config/mcp_config.json
    note: documentation de bibliothèques à jour

  - id: chrome-devtools
    kind: mcp
    name: Chrome DevTools
    source: npx chrome-devtools-mcp
    enabled: false
    agents: [hermes, gemini]
    targets:
      hermes: ~/.hermes/config.yaml
      gemini: ~/.gemini/config/mcp_config.json
    note: inspection du navigateur, utile pour les tests d'interface

  # ============================================================ plugins
  - id: vault-guard
    kind: plugin
    name: vault-guard
    source: local
    enabled: true
    agents: [hermes]
    targets:
      hermes: ~/.hermes/plugins/vault-guard
    note: bloque l'écriture dans les zones immuables du coffre

  # ============================================================ config
  - id: opencode-go
    kind: config
    name: opencode-go / qwen4-max
    source: https://opencode.ai/zen/go/v1
    enabled: true
    agents: [hermes]
    targets:
      hermes: ~/.hermes/.env
    note: fournisseur principal, 10 $ par mois

  - id: ollama-perf
    kind: config
    name: Ollama 8192 + q8_0
    source: systemd
    enabled: false
    agents: [hermes, opencode]
    targets:
      hermes: /etc/systemd/system/ollama.service.d/30-perf.conf
      opencode: ~/.config/opencode/opencode.json
    note: réglages mesurés sur la RTX 3070
